name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: northamerica-northeast1-docker.pkg.dev
  IMAGE: northamerica-northeast1-docker.pkg.dev/warpdemo-505821/warpdemo/fleetnet-route-planner

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix server install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund

      # Unit + API tests only. The Playwright critical flow runs post-deployment
      # against a real candidate revision (see release.yml) — a green CI here is
      # not on its own sufficient to promote a release.
      - name: Unit and API tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Build container image
        run: docker build -t fleetnet-route-planner:ci .

  # Publishes the merged image to Artifact Registry. This is a registry copy,
  # not a release: release.yml still builds its own candidate via Cloud Build
  # (`gcloud run deploy --source .`) and verifies that. Pushing here does not
  # promote anything and does not make a green CI sufficient to ship.
  push:
    name: Push image to Artifact Registry
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # sha-<short> is the durable identity; latest is a convenience pointer.
          # Deliberately not semver — nothing here is versioned or released from
          # a tag, and a scheme nothing consumes is just upkeep.
          tags: |
            type=sha
            type=raw,value=latest

      # Cloud Run is amd64. GitHub runners are too, so this is a native build,
      # but the platform is pinned so it stays correct on arm64 runners.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Tagged \`sha-${GITHUB_SHA::7}\` and \`latest\`."
            echo ""
            echo "> Not a release. Deploy and verification happen in release.yml."
          } >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Visual preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the container
        run: |
          docker build -t fleetnet-route-planner:pr .
          docker run -d --name fleetnet-pr -p 8080:8080 \
            -e RELEASE_VERSION=${GITHUB_SHA::7} \
            fleetnet-route-planner:pr
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health

      - name: Capture screenshots and walkthrough video
        env:
          BASE_URL: http://localhost:8080
        run: npm run capture

      - name: Upload media
        id: media
        uses: actions/upload-artifact@v4
        with:
          name: preview-media
          path: media/

      - name: Comment on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.media.outputs.artifact-url) }};
            const body = [
              '### Visual preview',
              '',
              `Captured from the containerized build of \`${context.sha.slice(0, 7)}\`.`,
              '',
              `**[Download screenshots + walkthrough video](${url})**`,
              '',
              'Includes: empty state, filled form, route results, results card, mobile layout,',
              'and a `.webm` walkthrough of the critical flow.',
              '',
              '> Note: CI runs unit + API tests only. The Playwright critical flow, error rate,',
              '> and p95 latency are evaluated **post-deployment** against a candidate revision.',
              '> A green CI here does not mean the release is promotable.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith('### Visual preview'),
            );

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Tear down
        if: always()
        run: docker rm -f fleetnet-pr || true
