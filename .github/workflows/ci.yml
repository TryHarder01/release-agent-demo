name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix server install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund

      # Unit + API tests only. The Playwright critical flow runs post-deployment
      # against a real candidate revision (see release.yml) — a green CI here is
      # not on its own sufficient to promote a release.
      - name: Unit and API tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Build container image
        run: docker build -t fleetnet-route-planner:ci .

  preview:
    name: Visual preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the container
        run: |
          docker build -t fleetnet-route-planner:pr .
          docker run -d --name fleetnet-pr -p 8080:8080 \
            -e RELEASE_VERSION=${GITHUB_SHA::7} \
            fleetnet-route-planner:pr
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health

      - name: Capture screenshots and walkthrough video
        env:
          BASE_URL: http://localhost:8080
        run: npm run capture

      - name: Upload media
        id: media
        uses: actions/upload-artifact@v4
        with:
          name: preview-media
          path: media/

      # Uploads the media to GitHub's comment-attachment store, which is the
      # only source of URLs GitHub will render as a real video player. The
      # endpoint is undocumented and its behaviour with an Actions token is not
      # guaranteed, so this never fails the job: MEDIA_GH_TOKEN (a fine-grained
      # PAT, verified against this endpoint) is used when set, GITHUB_TOKEN is
      # tried otherwise, and if both are rejected the comment falls back to the
      # artifact link.
      - name: Upload media as comment attachments
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MEDIA_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/publish-media.mjs

      - name: Comment on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const artifact = ${{ toJSON(steps.media.outputs.artifact-url) }};
            const raw = ${{ toJSON(steps.publish.outputs.assets) }};
            const assets = raw ? JSON.parse(raw) : null;
            const sha = context.sha.slice(0, 7);

            // A bare user-attachments URL on its own line is what GitHub turns
            // into a <video controls> player. Do not wrap it in a link or a
            // <video> tag — markdown link syntax leaves it a link, and raw
            // <video> is stripped by the comment sanitizer.
            const inline = assets
              ? [
                  assets['demo-walkthrough.mp4'],
                  '',
                  '<details><summary>Screenshots</summary>',
                  '',
                  `![Empty state](${assets['01-empty-state.png']})`,
                  `![Route results](${assets['03-route-results.png']})`,
                  `![Mobile layout](${assets['05-mobile-results.png']})`,
                  '',
                  '</details>',
                  '',
                  `[All captured media, including the source \`.webm\`](${artifact})`,
                ]
              : [
                  `**[Download screenshots + walkthrough video](${artifact})**`,
                  '',
                  '_Inline playback unavailable — the attachment upload was rejected.',
                  'Expected for pull requests from forks, which never receive secrets; otherwise',
                  'check that the `MEDIA_GH_TOKEN` secret is set and unexpired, and re-run._',
                ];

            const body = [
              '### Visual preview',
              '',
              `Captured from the containerized build of \`${sha}\`.`,
              '',
              ...inline,
              '',
              '> Note: CI runs unit + API tests only. The Playwright critical flow, error rate,',
              '> and p95 latency are evaluated **post-deployment** against a candidate revision.',
              '> A green CI here does not mean the release is promotable.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith('### Visual preview'),
            );

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Tear down
        if: always()
        run: docker rm -f fleetnet-pr || true
