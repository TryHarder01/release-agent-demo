name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: northamerica-northeast1-docker.pkg.dev
  IMAGE: northamerica-northeast1-docker.pkg.dev/warpdemo-505821/warpdemo/fleetnet-route-planner

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix server install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund

      # Unit + API tests only. The Playwright critical flow runs post-deployment
      # against a real candidate revision (see release.yml) — a green CI here is
      # not on its own sufficient to promote a release.
      - name: Unit and API tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Build container image
        run: docker build -t fleetnet-route-planner:ci .

  # Publishes the merged image that release.yml later deploys as a 0%-traffic
  # candidate. Pushing is not a release: verification still decides whether
  # the candidate revision may receive production traffic.
  push:
    name: Push image to Artifact Registry
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # The full commit SHA identifies the deployable artifact. `latest` is
          # a convenience pointer only; no deployment is allowed to use it.
          tags: |
            type=raw,value=git-${{ github.sha }}
            type=raw,value=latest

      # Cloud Run is amd64. GitHub runners are too, so this is a native build,
      # but the platform is pinned so it stays correct on arm64 runners.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Tagged \`git-${GITHUB_SHA}\` and \`latest\`."
            echo ""
            echo "> Not a release. release.yml deploys \`git-${GITHUB_SHA}\` as a candidate, then verifies it."
          } >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Visual preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the container
        run: |
          docker build -t fleetnet-route-planner:pr .
          docker run -d --name fleetnet-pr -p 8080:8080 \
            -e RELEASE_VERSION=${GITHUB_SHA::7} \
            fleetnet-route-planner:pr
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health

      - name: Capture screenshots and walkthrough video
        env:
          BASE_URL: http://localhost:8080
        run: npm run capture

      - name: Upload media
        id: media
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preview-media
          path: media/

      - name: Comment on the PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const url = ${{ toJSON(steps.media.outputs.artifact-url) }};
            const body = [
              '### Visual preview',
              '',
              `Captured from the containerized build of \`${context.sha.slice(0, 7)}\`.`,
              '',
              `**[Download screenshots + walkthrough video](${url})**`,
              '',
              'Includes: empty state, filled form, route results, results card, mobile layout,',
              'and a `.webm` walkthrough of the critical flow.',
              '',
              '> Note: CI runs unit + API tests only. The Playwright critical flow, error rate,',
              '> and p95 latency are evaluated **post-deployment** against a candidate revision.',
              '> A green CI here does not mean the release is promotable.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith('### Visual preview'),
            );

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Tear down
        if: always()
        run: docker rm -f fleetnet-pr || true
