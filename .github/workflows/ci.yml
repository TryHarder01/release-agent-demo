name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix server install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund

      # Unit + API tests only. The Playwright critical flow runs post-deployment
      # against a real candidate revision (see release.yml) — a green CI here is
      # not on its own sufficient to promote a release.
      - name: Unit and API tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Build container image
        run: docker build -t vantage-route-planner:ci .

  preview:
    name: Visual preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the container
        run: |
          docker build -t vantage-route-planner:pr .
          docker run -d --name vantage-pr -p 8080:8080 \
            -e RELEASE_VERSION=${GITHUB_SHA::7} \
            vantage-route-planner:pr
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health

      - name: Capture screenshots and walkthrough video
        env:
          BASE_URL: http://localhost:8080
        run: npm run capture

      - name: Upload media
        id: media
        uses: actions/upload-artifact@v4
        with:
          name: preview-media
          path: media/

      - name: Comment on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.media.outputs.artifact-url) }};
            const body = [
              '### Visual preview',
              '',
              `Captured from the containerized build of \`${context.sha.slice(0, 7)}\`.`,
              '',
              `**[Download screenshots + walkthrough video](${url})**`,
              '',
              'Includes: empty state, filled form, route results, results card, mobile layout,',
              'and a `.webm` walkthrough of the critical flow.',
              '',
              '> Note: CI runs unit + API tests only. The Playwright critical flow, error rate,',
              '> and p95 latency are evaluated **post-deployment** against a candidate revision.',
              '> A green CI here does not mean the release is promotable.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith('### Visual preview'),
            );

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Tear down
        if: always()
        run: docker rm -f vantage-pr || true
