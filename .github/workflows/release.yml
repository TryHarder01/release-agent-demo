name: Release

# Deploy a candidate revision, verify it, and only then promote.
# Trigger manually from the Actions tab or via `gh workflow run release.yml`.
on:
  # Label a pull request `deploy-candidate` to deploy its head commit as a
  # 0%-traffic candidate and run the full release path against it. Nothing
  # merges and no traffic moves; the label is a request for evidence.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      route_delay_ms:
        description: 'Injected upstream latency in ms (2500 reproduces the perf regression)'
        required: false
        default: '0'
      auto_promote:
        description: 'Promote automatically if verification returns PROMOTE'
        type: boolean
        required: false
        default: false
      skip_agent_review:
        description: 'Skip the Oz release-readiness review'
        type: boolean
        required: false
        default: false

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT || 'warpdemo-505821' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'northamerica-northeast1' }}
  SERVICE: fleetnet-route-planner
  IMAGE: northamerica-northeast1-docker.pkg.dev/warpdemo-505821/warpdemo/fleetnet-route-planner

jobs:
  release:
    name: Deploy candidate & verify
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'deploy-candidate' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    env:
      # On a pull request the default sha is the merge commit, which no image
      # was built for. ci.yml tags the branch head, so target that.
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix server install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # What production is serving right now. Captured before the deploy, so
      # the report names the revision the candidate is actually being compared
      # against rather than whatever happens to be serving when someone reads it.
      - name: Record the serving baseline
        id: baseline
        run: |
          revision=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --format='value(status.traffic.filter("percent:100").extract(revisionName))' | tr -d "[]'")
          url=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(status.url)')
          echo "baseline_revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "production_url=${url}" >> "$GITHUB_OUTPUT"
          echo "Baseline: ${revision:-none} at ${url}"

      - name: Deploy candidate revision (no traffic)
        id: deploy
        env:
          ROUTE_DELAY_MS: ${{ inputs.route_delay_ms || '0' }}
          RELEASE_VERSION: ${{ env.TARGET_SHA }}
          IMAGE_REF: ${{ env.IMAGE }}:git-${{ env.TARGET_SHA }}
          REVISION_ATTEMPT: ${{ github.run_number }}
        run: ./scripts/deploy.sh

      # Exit code: 0 = PROMOTE, 1 = STOP, 2 = NEEDS_REVIEW.
      - name: Verify release candidate
        id: verify
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.deploy.outputs.candidate_url }}
          CANDIDATE_REVISION: ${{ steps.deploy.outputs.candidate_revision }}
          BASELINE_REVISION: ${{ steps.baseline.outputs.baseline_revision }}
          PRODUCTION_URL: ${{ steps.baseline.outputs.production_url }}
        run: npm run verify

      # Visual evidence of what the candidate actually looked like when verified.
      - name: Capture candidate media
        if: ${{ always() }}
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.deploy.outputs.candidate_url }}
        run: npm run capture

      - name: Upload release report
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-report
          path: |
            release-report.json
            playwright-report/
            media/

      # A verdict is only legible if you can see it from the pull request list.
      # The gate's is available the moment it runs; the agent's arrives minutes
      # later, so mark the review as in flight and let the agent replace it.
      #
      # Any agent verdict still on the pull request describes the previous
      # candidate, so clear it before this one is reviewed.
      - name: Stamp the gate verdict
        if: ${{ always() && github.event_name == 'pull_request' && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          verdict=$(jq -r '.verdict // empty' release-report.json 2>/dev/null || true)
          case "${verdict}" in
            PROMOTE)      want='gate:promote' ;;
            NEEDS_REVIEW) want='gate:needs-review' ;;
            STOP)         want='gate:stop' ;;
            *) echo "No verdict in release-report.json; leaving labels alone." ; exit 0 ;;
          esac

          stale=''
          for l in 'gate:promote' 'gate:needs-review' 'gate:stop' \
                   'agent:ready' 'agent:human-review' 'agent:not-ready'; do
            [ "$l" = "$want" ] || stale="${stale}${stale:+,}${l}"
          done
          gh pr edit "$PR" --remove-label "$stale" || true
          gh pr edit "$PR" --add-label "$want"
          echo "Gate verdict ${verdict} -> ${want}"

      # The gate answers "did the checks pass". This asks whether those checks
      # covered what changed — a question no threshold can express, and the one
      # a PROMOTE most needs asked. It is advisory: it never gates the job and
      # never promotes. Runs read-only against GCP under a viewer identity.
      #
      # Skipped rather than failed when WARP_API_KEY is absent, so the release
      # path does not depend on the agent being configured.
      - name: Oz release-readiness review
        id: agent
        if: ${{ !inputs.skip_agent_review && always() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          WARP_API_KEY: ${{ secrets.WARP_API_KEY }}
          OZ_ENVIRONMENT: ${{ vars.OZ_ENVIRONMENT || '6E6yxZoQ6uUZCFDrQDiZ7Z' }}
          OZ_RELEASE_READINESS_AGENT: ${{ vars.OZ_RELEASE_READINESS_AGENT }}
          CANDIDATE_REVISION: ${{ steps.deploy.outputs.candidate_revision }}
          CANDIDATE_URL: ${{ steps.deploy.outputs.candidate_url }}
          BASELINE_REVISION: ${{ steps.baseline.outputs.baseline_revision }}
          PRODUCTION_URL: ${{ steps.baseline.outputs.production_url }}
        run: |
          if [ -z "${WARP_API_KEY}" ]; then
            echo "WARP_API_KEY not set; skipping the agent review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "${PR}" ]; then
            gh pr edit "${PR}" --add-label 'agent:reviewing' || true
          fi

          # The tarball holds the binary as `oz-stable` alongside a `resources/`
          # tree it loads at runtime, so keep the two together and call the
          # binary by path rather than dropping it on PATH.
          mkdir -p "${RUNNER_TEMP}/oz"
          curl -fsSL 'https://app.warp.dev/download/cli?os=linux&package=tar&arch=x86_64' \
            | tar -xz -C "${RUNNER_TEMP}/oz"
          OZ="${RUNNER_TEMP}/oz/oz-stable"
          "$OZ" --version

          verdict=$(jq -r '.verdict' release-report.json 2>/dev/null || echo unknown)

          # Facts only. Naming the conclusion would make the answer worthless.
          agent_output=$("$OZ" agent run-cloud \
            --environment "${OZ_ENVIRONMENT}" \
            --agent "${OZ_RELEASE_READINESS_AGENT}" \
            --computer-use \
            --name release-readiness \
            --title "Release readiness: ${CANDIDATE_REVISION}" \
            --prompt "Release readiness review for the FleetNet candidate now deployed on Cloud Run.

          Repo: ${{ github.repository }}, ref ${{ github.ref_name }}, commit ${{ github.sha }}.
          Candidate revision: ${CANDIDATE_REVISION}
          Candidate URL (0% of traffic): ${CANDIDATE_URL}
          Serving in production: ${BASELINE_REVISION} at ${PRODUCTION_URL}
          The two revisions run on identical infrastructure and differ by exactly this commit.
          The release gate returned: ${verdict}. Its release-report.json is an artifact of run ${{ github.run_id }}.
          Pull request under review: ${PR:-none}.
          GCP project warpdemo-505821, region northamerica-northeast1, service fleetnet-route-planner.
          A read-only service account key is in \$GCP_SA_KEY.

          Produce the release readiness brief. The changed behavior is reachable
          through the shipped UI: use computer use to attach a control screenshot,
          an affected-path screenshot, and a short walkthrough video. Add a
          **Visual evidence** section with direct artifact links to the brief. If
          any visual evidence cannot be captured, record why under **Unknowns**;
          do not omit it silently.

          Post the complete brief, including its **Visual evidence** links, as a
          comment on pull request ${PR}. An Oz-run-only brief is incomplete.

          When the brief is finished, record your verdict as a label on pull request ${PR},
          so it is visible from the pull request list without opening anything:

            gh pr edit ${PR} --remove-label 'agent:reviewing,agent:ready,agent:human-review,agent:not-ready'
            gh pr edit ${PR} --add-label '<label>'

          Use agent:ready for READY, agent:human-review for HUMAN REVIEW, and
          agent:not-ready for NOT READY. Apply exactly one. This records the verdict
          you reached; it is not a hint about which verdict to reach." 2>&1 || true)

          echo "${agent_output}"

          # `agent run-cloud` prints human-readable lines regardless of
          # --output-format, so pull the run id out by shape rather than
          # parsing it as JSON.
          run_id=$(printf '%s' "${agent_output}" \
            | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
            | head -1)

          if [ -z "${run_id}" ]; then
            echo "Could not determine the agent run id from the CLI output." >&2
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

          {
            echo "### Oz release-readiness review"
            echo ""
            echo "Gate verdict: \`${verdict}\`"
            echo ""
            if [ -n "${run_id}" ]; then
              echo "Brief: https://oz.warp.dev/runs/${run_id}"
            else
              echo "The agent was launched but its run id could not be parsed."
            fi
            echo ""
            echo "> Advisory. This review does not gate the job and cannot promote."
          } >> "$GITHUB_STEP_SUMMARY"

      # Put the evidence where the change is being discussed. One comment,
      # updated in place, so a re-run does not bury the thread.
      - name: Comment the release result on the pull request
        if: ${{ always() && github.event_name == 'pull_request' && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CANDIDATE_URL: ${{ steps.deploy.outputs.candidate_url }}
          CANDIDATE_REVISION: ${{ steps.deploy.outputs.candidate_revision }}
          BASELINE_REVISION: ${{ steps.baseline.outputs.baseline_revision }}
          AGENT_RUN_ID: ${{ steps.agent.outputs.run_id }}
        run: |
          verdict=$(jq -r '.verdict // "unknown"' release-report.json 2>/dev/null || echo unknown)

          {
            echo "<!-- release-candidate -->"
            echo "### Release candidate"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Gate verdict | \`${verdict}\` |"
            echo "| Candidate | \`${CANDIDATE_REVISION}\` at 0% traffic |"
            echo "| Baseline | \`${BASELINE_REVISION}\` serving 100% |"
            echo "| Candidate URL | ${CANDIDATE_URL} |"
            if [ -n "${AGENT_RUN_ID}" ]; then
              echo "| Agent brief | https://oz.warp.dev/runs/${AGENT_RUN_ID} |"
            fi
            echo ""
            echo "The gate verdict says whether the checks passed. The agent brief says"
            echo "whether those checks reached what this pull request changed."
            echo ""
            echo "> Nothing merged and no traffic moved. Promotion stays a human action."
          } > /tmp/pr-comment.md

          existing=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- release-candidate -->"))][0].id // empty')
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing}" \
              -F body=@/tmp/pr-comment.md >/dev/null
          else
            gh pr comment "${PR}" --body-file /tmp/pr-comment.md
          fi

      - name: Promote to production
        if: ${{ inputs.auto_promote && steps.verify.outcome == 'success' }}
        run: ./scripts/promote.sh "${{ steps.deploy.outputs.candidate_revision }}"

      - name: Fail the job if the candidate did not pass policy
        if: ${{ steps.verify.outcome != 'success' }}
        run: |
          echo "Release verification did not return PROMOTE. Candidate left at 0% traffic."
          cat release-report.json || true
          exit 1
